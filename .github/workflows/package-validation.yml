name: Package Validation

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Shared package validation
    # Coordinated migration pin. Restore to @develop after the matching
    # Package Registry migration has merged.
    uses: Deucarian/Package-Registry/.github/workflows/deucarian-package-validation.yml@codex/platform-package-registry
    with:
      package-config: deucarian-package.json
      registry-ref: codex/platform-package-registry
